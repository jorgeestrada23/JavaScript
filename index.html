<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Compra</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="contenedor">
        <section class="tarjeta">
            <h1>🛒 Calculadora de Compra</h1>

            <p>
                Haz clic en el botón para ingresar los datos
                de tu compra y calcular el total.
            </p>

            <button id="btnCalcular">Calcular compra</button>

            <div id="resultado" class="resultado">
                <p>El resultado aparecerá aquí.</p>
            </div>
        </section>
    </main>
    <script src="main.js" defer></script>
</body>
</html>
